<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Last Meal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Ubuntu:wght@400;500;700&display=swap">
<style>
/* Screens follow the Figma flow: drag-0 (home), drag-0-1 (recipe), drag-1 to drag-6 (edit), drag-7 to drag-9 (home after saving). Values are copied from the Figma file. Single light theme. */
:root {
  --page: #f4f4f4; --desk: #e8e5e4; --hover-light: #eeeeee; --bar: #f9f9f9;
  --ink: #000000; --ink-soft: #1b1b1b; --ink-2: #343231; --muted: #93918b; --muted-2: #7a7873; --meal-time: #6b635e; --meal-name: #1f281a;
  --line: #d6d6d6; --line-warm: #d1c0bb; --line-edit: #cbc8c2; --select: #f6d5d9;
  --info-bg: #dddef9; --info-fg: #4f53ce;
  --ok-bg: #cce4df; --ok-fg: #007059;
  --fail-bg: #f6d5d9; --fail-fg: #b5263f;
  --sugg-bg: #f8e7e3; --sugg-fg: #b74f30; --sugg-line: #e7c5bb;
  --m-lunch: #595de3; --m-dinner: #00765e; --m-breakfast: #d05a37;
  --font-display: "DM Serif Display", Georgia, serif;
  --font-body: "Ubuntu", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--desk); color: var(--ink); font-family: var(--font-body); font-size: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
/* text styles */
.t-xs-reg-up { font-weight: 400; font-size: 10px; line-height: 14px; text-transform: uppercase; }
.t-xs-bold-up { font-weight: 700; font-size: 10px; line-height: 14px; text-transform: uppercase; }
.frame { width: 100%; max-width: 393px; height: 852px; margin: 0 auto; background: var(--page); position: relative; overflow: hidden; }
.view { display: none; }
.view.on { display: block; height: 852px; overflow-y: auto; }
#recipe .r-btn { position: sticky; bottom: 0; margin-top: 24px; }
.mk { width: 10px; height: 10px; display: grid; place-items: center; flex: none; }
.mk i { display: block; }
.mk .circle { width: 6px; height: 6px; border-radius: 50%; background: var(--m-breakfast); }
.mk .square { width: 6px; height: 6px; background: var(--m-lunch); }
.mk .triangle { width: 7px; height: 6px; background: var(--m-dinner); clip-path: polygon(50% 0, 100% 100%, 0 100%); }

/* components copied from Figma. Shadows: card = 0 16 27 10 at 10%, pressed = 0 4 24 5 at 2%. */
:root { --sh: 0 16px 27.2px 5.5px rgba(0,0,0,.08); --sh-press: 0 16px 27.2px 5.5px rgba(0,0,0,.08); }
.btn { border: 1px solid var(--ink-2); background: var(--page); box-shadow: var(--sh); padding: 0; display: inline-grid; place-items: center; cursor: pointer; flex: none; color: var(--ink-2); }
.btn:hover { background: var(--hover-light); border-color: var(--meal-time); }
.btn:active { background: var(--desk); box-shadow: var(--sh-press); }
.btn:focus-visible, .mcard:focus-visible { outline: 2px solid var(--meal-time); outline-offset: 4px; }
.btn:disabled { background: var(--line); border-color: transparent; box-shadow: none; cursor: default; }
.btn.sm { height: 32px; min-width: 32px; padding: 0 12px; }
.btn.md { height: 42px; min-width: 42px; padding: 0 12px; }
.btn.dark { background: var(--ink-2); border-color: transparent; color: #fff; }
.btn.dark:hover { background: var(--meal-time); }
.btn.dark:active { background: #000; box-shadow: var(--sh-press); }
.btn.lg { height: 52px; width: 100%; font-weight: 500; font-size: 16px; line-height: 21px; }
.btn.lg.dark { background: var(--ink-2); }
.btn.lg:disabled { background: var(--line); color: var(--muted); }
.mtl { display: flex; align-items: center; gap: 4px; height: 20px; font-size: 14px; line-height: 16px; color: var(--meal-time); }
.mtl .ic { width: 20px; height: 20px; display: grid; place-items: center; flex: none; }
.mtl .ic i { display: block; }
.mtl .circle { width: 12px; height: 12px; border-radius: 50%; background: var(--m-breakfast); }
.mtl .square { width: 12px; height: 12px; background: var(--m-lunch); }
.mtl .triangle { width: 14px; height: 12px; background: var(--m-dinner); clip-path: polygon(50% 0, 100% 100%, 0 100%); }

/* home */
#home, #edit { height: 852px; }
#home .scroll { height: 100%; overflow-y: auto; padding-bottom: 240px; }
.top { height: 112px; padding: 88px 24px 0; display: flex; justify-content: space-between; align-items: flex-start; }
.profile { display: flex; align-items: center; gap: 8px; height: 24px; font-weight: 400; font-size: 14px; line-height: 16px; text-transform: uppercase; color: var(--ink-2); }
.avatar { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--ink-2); }
.bell { width: 27px; height: 25px; margin: -1px -3px 0 0; }
.pad { padding: 0 24px; }
.cal { display: flex; flex-direction: column; gap: 12px; }
.heading { height: 80px; display: flex; align-items: center; justify-content: space-between; }
.month-day { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 400; font-size: 48px; line-height: 56px; color: var(--meal-name); }
.month-day .dd { width: 16px; height: 16px; flex: none; display: block; }
.chev { width: 16px; height: 16px; padding: 0; border: 0; background: none; cursor: pointer; flex: none; display: block; }
.chev svg { width: 16px; height: 16px; display: block; }
.chev.next svg { transform: scaleX(-1); }
.view-toggle { width: 32px; height: 32px; flex: none; display: block; }
.vt-btn { width: 32px; height: 32px; margin-top: 24px; padding: 0; border: 0; background: none; cursor: pointer; flex: none; }
.vt-btn:focus-visible { outline: 2px solid var(--info-fg); outline-offset: 2px; }
.heading .month-day, .cx-ttl > span:first-child { margin-right: auto; }
.wk-row { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; padding-top: 16px; }
.wk-row::-webkit-scrollbar { display: none; }
.wk-day { width: 124px; flex: none; display: flex; flex-direction: column; gap: 8px; }
.wk-h { height: 28px; box-sizing: border-box; border-bottom: 1px solid #93918b; padding-top: 3px; font: 400 12px/15px var(--font-body); text-transform: uppercase; color: #000; }
.wk-m + .wk-m { margin-top: 16px; }
.wk-m { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.wk-m .mtl { align-self: flex-start; }
.wk-m .rt { width: 124px; height: 164px; }
.dates { padding-top: 16px; display: flex; flex-direction: column; gap: 14px; }
.weekdays { height: 24px; display: flex; justify-content: space-between; align-items: center; }
.weekdays span { width: 36px; text-align: center; font-size: 10px; line-height: 13px; color: var(--ink-soft); }
.weeks { display: flex; flex-direction: column; gap: 8px; }
.week { display: flex; justify-content: space-between; }
.day { width: 36px; height: 36px; padding: 4px 0 0; border: 1.2px dashed var(--line-warm); border-radius: 2px; background: var(--page); display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; font-size: 10px; line-height: 13px; color: var(--ink-2); position: relative; }
.day.out { border-color: var(--line); color: var(--muted); }
.day.sel { background: var(--select); border-color: transparent; }
.day.over { background: var(--select); border: 1.2px solid var(--ink-2); }
.day:hover:not(.sel) { border-color: var(--ink-2); }
.day .today { position: absolute; left: -1.2px; right: -1.2px; bottom: -1.2px; height: 2px; background: #000; }
/* home calendar: mode view, solid surface-page cells, no outline */
#home .day { border: 0; background: var(--page); padding-top: 4px; }
#home .day.out { color: var(--muted); }
#home .day.sel { background: var(--line-warm); color: #000; }
#home .day:hover:not(.sel) { background: var(--hover-light); }
#home .day .today { left: 0; right: 0; bottom: 0; }
.plan { display: flex; height: 9px; padding: 0 2px; }
.plan .mk { margin-top: -1px; }
.day:focus-visible, .done:focus-visible, .card:focus-visible, .ib:focus-visible, .disc:focus-visible, .chev:focus-visible, .sw:focus-visible, .tab:focus-visible { outline: 2px solid var(--info-fg); outline-offset: 2px; }
.toast-slot { display: flex; justify-content: center; min-height: 26px; }
.toast-slot:empty { display: none; }
.toast-slot.right { justify-content: flex-end; }
.toast { display: inline-flex; align-items: center; gap: 10px; height: 26px; padding: 6px 12px; border-radius: 30px; background: var(--info-bg); color: var(--info-fg); white-space: nowrap; }
.toast.ok { background: var(--ok-bg); color: var(--ok-fg); }
.toast .undo { width: 20px; height: 20px; margin: -3px 0; border: 0; background: none; padding: 0; border-radius: 10px; cursor: pointer; display: grid; place-items: center; flex: none; }
.toast .undo:hover { background: rgba(0,0,0,.08); }
.toast .undo svg { width: 20px; height: 20px; display: block; }
.toast .undo:focus-visible { outline: 2px solid var(--ink-2); outline-offset: 1px; }
.toast.fail { background: var(--fail-bg); color: var(--fail-fg); }
.toast.sugg { gap: 12px; padding: 0 4px 0 10px; border-radius: 14px; background: var(--sugg-bg); color: var(--ink); height: 28px; }
.sugg .content { display: flex; align-items: center; gap: 6px; }
.sugg .sparkle { width: 12px; height: 12px; flex: none; }
.sugg .actions { display: flex; align-items: center; gap: 4px; }
.sugg .divider { width: 1px; height: 20px; background: var(--sugg-line); }
.ib { width: 20px; height: 20px; border: 0; background: none; padding: 0; border-radius: 10px; cursor: pointer; display: grid; place-items: center; }
.ib:hover { background: rgba(183,79,48,.12); }
.ib svg { width: 20px; height: 20px; display: block; }
.disc { display: flex; justify-content: center; width: 100%; height: 12px; padding: 0; border: 0; background: none; cursor: pointer; margin: 12px 0 -4px; }
.disc svg { width: 12px; height: 12px; transition: transform .2s; }
.disc.open svg { transform: rotate(180deg); }
.plan-list { padding: 0 24px; }
.edit-btn { display: flex; justify-content: flex-end; }
.edit-btn .btn svg { width: 16px; height: 16px; display: block; }
.daily { padding-top: 16px; display: flex; flex-direction: column; gap: 16px; }
.mcc { display: flex; flex-direction: column; gap: 16px; }
.mcard { display: block; width: 100%; height: 74px; border: 0; padding: 0; background: none; text-align: left; cursor: pointer; font: inherit; }
.mcard .cc { display: flex; gap: 16px; height: 74px; background: var(--page); box-shadow: var(--sh); }
.mcard img { width: 74px; height: 74px; object-fit: cover; display: block; flex: none; background: #fff; }
.mcard .nm { flex: 1; display: flex; align-items: center; font-weight: 500; font-size: 16px; line-height: 21px; color: var(--meal-name); }
.mcard:hover .cc { background: var(--hover-light); }
.mcard:active .cc { background: var(--desk); box-shadow: 0 4px 24.2px 5px rgba(0,0,0,.02); }
.mcard:active .nm { color: #000; }
.mcard:hover .nm { color: var(--meal-time); }
.mcard:active .cc { background: var(--desk); box-shadow: var(--sh-press); }
.mcard:active .nm { color: #000; }
.mcard:disabled .cc { background: var(--line); box-shadow: none; }
.mcard:disabled .nm { color: var(--muted); }
.empty { padding: 24px 0; font-size: 14px; color: var(--muted-2); }
.dock { position: absolute; left: 0; right: 0; bottom: 0; height: 222px; pointer-events: none; }
.dock > * { pointer-events: auto; }
.reco { height: 42px; padding: 0 24px; display: flex; justify-content: flex-end; }
.reco .btn { width: 44px; }
.reco.open { align-items: flex-start; gap: 8px; }
.rc-left { display: flex; gap: 12px; }
.rc-btns { display: flex; gap: 8px; }
.rc-tiles { display: flex; gap: 2px; }
.rc-tile { width: 42px; height: 42px; padding: 0; border: 0; background: var(--desk); cursor: pointer; flex: none; }
.rc-tile img { width: 42px; height: 42px; display: block; }
.rc-tile:hover img { filter: brightness(.92); }
.rc-tile:focus-visible { outline: 2px solid var(--meal-time); outline-offset: 2px; }
.reco .btn svg { width: 20px; height: 20px; }
.groc { height: 42px; margin-top: 14px; padding: 0 24px; display: flex; justify-content: flex-end; }
.basket { position: relative; width: 42px; height: 42px; background: #fff; box-shadow: var(--sh); flex: none; }
.basket .btn { width: 42px; height: 42px; padding: 0; border-width: 1.2px; box-shadow: none; }
.basket .btn svg { width: 20px; height: 20px; }
.basket .count { position: absolute; left: 31px; top: -4px; width: 16px; height: 16px; border-radius: 50%; background: #d6522a; color: #fff; font-size: 12px; line-height: 1; display: grid; place-items: center; pointer-events: none; }
.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 108px; background: var(--bar); display: flex; justify-content: space-between; padding: 12px 48px 0; }
.tab { width: 48px; height: 50px; border: 0; background: none; padding: 0; cursor: pointer; }
.tab svg { width: 48px; height: 50px; display: block; }


/* home: create a plan (empty day) */
.mk-empty { padding-top: 12px; }
.plan-link { height: 44px; padding: 0 12px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--ink-2); background: var(--page); box-shadow: var(--sh); cursor: pointer; color: var(--ink-2); font-family: var(--font-display); font-size: 18px; line-height: 22px; }
.plan-link:hover { background: var(--hover-light); border-color: var(--meal-time); }
.plan-link:active { background: var(--desk); box-shadow: var(--sh-press); }
.plan-link:focus-visible { outline: 2px solid var(--meal-time); outline-offset: 4px; }
.plan-link svg { width: 20px; height: 20px; display: block; flex: none; }
.rtiles { display: flex; gap: 2px; margin: 16px -24px 0 0; overflow: hidden; }
.rt { width: 124px; height: 164px; flex: none; position: relative; background: var(--desk); }
.rt img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rt .ico { position: absolute; left: 96px; top: 8px; width: 20px; height: 20px; }
.rt .ico svg { width: 20px; height: 20px; display: block; }
.rt.more::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.rt.more span { position: absolute; left: 0; right: 0; top: 78px; z-index: 1; text-align: center; color: #fff; font-size: 16px; line-height: 21px; }
/* assistant sheet (AI-agent flow) */
.scrim { position: absolute; inset: 0; background: rgba(52,50,49,.35); z-index: 40; display: none; }
.scrim.on { display: block; }
.agent { position: absolute; left: 0; right: 0; bottom: 0; height: 608px; background: var(--page); z-index: 41; box-shadow: 0 -16px 27.2px 5.5px rgba(0,0,0,.08); display: none; overflow: hidden; outline: 0; }
.agent.on { display: block; }
.ag-drag { position: absolute; left: 0; right: 0; top: 0; height: 52px; }
.ag-drag i { position: absolute; left: 50%; margin-left: -14px; top: 12px; width: 28px; height: 4px; border-radius: 2px; background: var(--line); }
.ag-body { position: absolute; left: 24px; right: 24px; top: 52px; }
.agent.s2 .ag-body { top: 48px; }
.ag-h { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 25px; color: #000; }
.ag-list { margin-top: 24px; display: flex; flex-direction: column; gap: 5px; }
.ag-item { display: flex; align-items: stretch; width: 100%; height: 48px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; font: inherit; }
.ag-item:hover { background: var(--hover-light); }
.ag-item:focus-visible, .ag-meal:focus-visible, .ag-chip:focus-visible, .ag-cal:focus-visible, .ag-back:focus-visible, .ag-x:focus-visible { outline: 2px solid var(--meal-time); outline-offset: 2px; }
.ag-item .ic { width: 48px; height: 48px; display: grid; place-items: center; flex: none; }
.ag-item .ic svg { width: 39px; height: 39px; display: block; }
.ag-item .lab { margin-left: 12px; flex: 1; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #a6a6a6; color: #335c45; font-size: 14px; line-height: 16px; }
.ag-item .lab svg { width: 24px; height: 24px; margin-right: 6px; display: block; }
.ag-tabs { margin-top: 24px; display: flex; gap: 24px; }
.ag-tab { height: 29px; padding: 0 0 6px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; font: inherit; font-weight: 500; font-size: 16px; line-height: 21px; color: var(--muted); }
.ag-tab[aria-selected="true"] { color: #000; border-bottom-color: #000; }
.ag-rows { margin-top: 24px; display: flex; flex-direction: column; gap: 24px; }
.ag-row { position: relative; height: 46px; display: flex; align-items: flex-start; border-bottom: 1px solid var(--ink-2); }
.ag-row .ing { width: 46px; height: 46px; flex: none; }
.ag-row .ing svg { width: 46px; height: 46px; display: block; }
.ag-row .info { margin-left: 12px; padding-top: 4px; }
.ag-row .nm { font-weight: 500; font-size: 14px; line-height: 16px; color: #000; }
.ag-row .qty { margin-top: 3px; height: 16px; display: flex; align-items: center; font-size: 12px; line-height: 15px; color: var(--ink-2); }
.ag-row .qty small { font-size: 10px; margin-left: 6px; margin-right: 2px; }
.ag-row .qty svg { width: 16px; height: 16px; display: block; }
.ag-row .ag-stock { position: absolute; right: 8px; top: 11px; height: 24px; padding: 0 12px; border-radius: 22px; background: var(--info-bg); color: var(--info-fg); font-weight: 500; font-size: 12px; line-height: 24px; }
.ag-btnrow { margin-top: 24px; display: flex; justify-content: flex-end; gap: 10px; }
.ag-dk { background: var(--ink-2); border-color: transparent; color: #fff; font-size: 14px; line-height: 16px; }
.ag-dk:hover { background: #000; border-color: transparent; }
.ag-chips { display: flex; gap: 16px; overflow-x: auto; margin: 24px -24px 0 0; padding-right: 24px; scrollbar-width: none; }
.ag-chips::-webkit-scrollbar { display: none; }
.ag-ing { flex: none; height: 40px; border: 1px solid var(--ink-2); border-radius: 30px; display: inline-flex; align-items: center; padding: 0 20px 0 16px; font-weight: 500; font-size: 14px; line-height: 16px; color: #000; }
.ag-ing b { font-weight: 400; color: var(--fail-fg); margin-left: 14px; }
.ag-ing small { font-size: 10px; color: var(--muted); margin-left: 4px; }
.ag-sec { margin-top: 48px; height: 21px; display: flex; align-items: center; gap: 6px; font-weight: 500; font-size: 16px; line-height: 21px; color: var(--ink-2); }
.ag-sec svg { width: 16px; height: 16px; display: block; }
.ag-meals { margin-top: 16px; display: flex; flex-direction: column; gap: 16px; }
.ag-meal { display: flex; gap: 16px; width: 100%; height: 74px; padding: 0; border: 0; background: var(--page); text-align: left; cursor: pointer; font: inherit; }
.ag-meal:hover { background: var(--hover-light); }
.ag-meal img { width: 74px; height: 74px; object-fit: cover; display: block; flex: none; }
.ag-meal .ct { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: center; border-bottom: 1px solid #a6a6a6; }
.ag-meal .ct b { font-weight: 400; font-size: 14px; line-height: 16px; color: #000; }
.ag-meal .ct small { font-size: 10px; line-height: 13px; color: var(--ink-2); margin-top: 5px; }
.ag-need { position: absolute; right: 8px; top: 25px; height: 24px; padding: 0 12px; border: 1px solid var(--ink-2); border-radius: 22px; background: var(--page); display: inline-flex; align-items: center; gap: 4px; font-size: 10px; line-height: 14px; text-transform: uppercase; color: #000; }
.ag-need svg { width: 16px; height: 16px; display: block; }
.ag-need b { font-weight: 500; color: var(--fail-fg); }
.ag-top { display: flex; justify-content: space-between; align-items: center; height: 48px; }
.ag-back { width: 44px; height: 44px; padding: 0; border: 0; background: none; cursor: pointer; }
.ag-back:hover { opacity: .75; }
.ag-back svg { width: 44px; height: 44px; display: block; }
.ag-mchip, .ag-dchip { display: flex; align-items: center; background: var(--desk); color: #000; font-size: 14px; line-height: 16px; }
.ag-mchip { width: 186px; height: 48px; }
.ag-mchip img { width: 48px; height: 48px; object-fit: cover; flex: none; }
.ag-mchip span { margin-left: 12px; }
.ag-dchip { width: 188px; height: 46px; }
.ag-dchip img { width: 46px; height: 46px; object-fit: cover; flex: none; }
.ag-dchip .mk20 { width: 20px; height: 20px; margin-left: 12px; display: grid; place-items: center; flex: none; }
.ag-dchip .mk20 i { width: 12px; height: 12px; background: var(--m-lunch); display: block; }
.ag-dchip .dt { margin-left: 4px; flex: 1; }
.ag-x { width: 20px; height: 20px; margin-right: 8px; padding: 0; border: 0; background: none; cursor: pointer; flex: none; }
.ag-x svg { width: 20px; height: 20px; display: block; }
.ag-pick { display: flex; align-items: center; height: 46px; }
.ag-cal { width: 48px; height: 46px; flex: none; border: 0; background: var(--ink-2); box-shadow: var(--sh); display: grid; place-items: center; cursor: pointer; }
.ag-cal:hover { background: #000; }
.ag-cal svg { width: 24px; height: 24px; display: block; }
.ag-days { display: flex; gap: 12px; overflow-x: auto; margin: 0 -24px 0 24px; padding-right: 24px; scrollbar-width: none; }
.ag-days::-webkit-scrollbar { display: none; }
.ag-chip { flex: none; height: 40px; border: 1px solid var(--ink-2); border-radius: 30px; background: var(--page); display: inline-flex; align-items: center; gap: 8px; padding: 0 17px 0 20px; font-weight: 500; font-size: 14px; line-height: 16px; color: #000; cursor: pointer; font-family: inherit; }
.ag-chip i { width: 12px; height: 12px; background: var(--m-lunch); display: block; }
.ag-chip:hover { background: var(--hover-light); }
.ag-chip.on { background: var(--desk); }
.ag-col { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.ag-steps { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
.ag-step { display: flex; height: 48px; }
.ag-step img { width: 48px; height: 48px; object-fit: cover; flex: none; }
.ag-step .sl { margin-left: 12px; flex: 1; display: flex; align-items: center; gap: 9px; border-bottom: 1px solid #a6a6a6; font-size: 14px; line-height: 16px; color: #000; padding-left: 2px; }
.ag-step .n { width: 16px; height: 16px; border-radius: 50%; background: #000; color: #fff; font-size: 12px; line-height: 16px; text-align: center; flex: none; }
.ag-msg { position: absolute; left: 24px; right: 24px; bottom: 43px; }
.ag-ml { font-size: 14px; line-height: 16px; color: #000; margin-bottom: 8px; }
.ag-in { position: relative; display: block; height: 42px; }
.ag-in .ag-ic { position: absolute; left: 5px; top: 0; width: 42px; height: 42px; pointer-events: none; }
.ag-in .ag-ic svg { width: 42px; height: 42px; display: block; }
.ag-in input { width: 100%; height: 42px; padding: 0 12px 0 60px; border: 1px solid var(--line); background: rgba(232,229,228,.64); font: inherit; font-size: 14px; color: #000; outline: 0; }
.ag-in input::placeholder { color: var(--muted); }
.ag-in input:focus { border-color: var(--ink-2); }
.calov { position: absolute; inset: 0; z-index: 60; background: rgba(52,50,49,.45); display: none; }
.calov.on { display: block; }
.cv-card { position: absolute; left: 24px; right: 24px; top: 50%; transform: translateY(-50%); background: var(--page); border-radius: 4px; box-shadow: var(--sh); padding: 12px 24px 16px; }
.cv-h { height: 40px; display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-size: 36px; line-height: 40px; color: var(--ink-soft); }
.cv-h svg { width: 16px; height: 16px; display: block; }
.cv-wd, .cv-w { display: grid; grid-template-columns: repeat(7, 1fr); }
.cv-wd { margin-top: 28px; font-size: 10px; line-height: 13px; color: var(--ink-soft); text-align: center; }
.cv-w { margin-top: 8px; }
.cv-d { height: 44px; border: 0; background: none; padding: 0; font: inherit; font-size: 10px; line-height: 13px; color: var(--ink-2); cursor: pointer; position: relative; }
.cv-d.out { color: var(--muted); }
.cv-d:hover { background: var(--hover-light); }
.cv-d.today::after { content: ""; position: absolute; left: 3px; right: 3px; bottom: 6px; height: 2px; background: #000; }
.cv-d:focus-visible { outline: 2px solid var(--meal-time); outline-offset: -2px; }


.cartov { position: absolute; inset: 0; z-index: 45; background: rgba(0,0,0,.33); display: none; }
.cartov.on { display: block; }
.cart { position: absolute; left: 72px; right: 24px; bottom: 170px; background: var(--page); box-shadow: var(--sh); padding: 40px 24px 24px; border-radius: 2px; }
.cart h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 25px; color: var(--ink-2); padding-bottom: 19px; border-bottom: 1px solid #000; }
.cart-rows { padding-top: 24px; }
.cart-row { display: grid; grid-template-columns: 24px 1fr; column-gap: 27px; padding-bottom: 24px; }
.cart-row .cb { width: 24px; height: 24px; margin-top: 16px; padding: 0; border: 0; background: none; cursor: pointer; align-self: start; }
.cart-row .cb svg { width: 24px; height: 24px; display: block; }
.cart-row .main { border-bottom: 1px solid #a6a6a6; display: flex; align-items: center; justify-content: space-between; height: 48px; }
.cart-row .nm { font-weight: 500; font-size: 16px; line-height: 21px; color: #000; }
.cart-row .unit { height: 32px; padding: 0 10px; border: 1px solid var(--ink-2); background: var(--page); font-size: 10px; line-height: 14px; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.cart-row .unit svg { width: 16px; height: 16px; }
.cart-row .qty { grid-column: 2; display: flex; align-items: center; justify-content: space-between; padding: 12px 6px 0; font-size: 14px; color: #000; }
.cart-row .qty button { width: 20px; height: 20px; padding: 0; border: 0; background: none; cursor: pointer; }
.cart-row .qty button svg { width: 20px; height: 20px; display: block; }
.cart-row .qty button:hover { background: var(--hover-light); }
.cart-row.off .nm, .cart-row.off .qty span { color: var(--muted); }
.cart-add { display: flex; justify-content: flex-end; }
.cart-add .btn { width: 40px; height: 40px; }
.cart-foot { margin-top: 16px; padding-top: 24px; border-top: 1px solid #000; display: flex; justify-content: space-between; }
.cart-foot .btn.md { height: 42px; }
.basket .count.bump { animation: bump .5s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }
/* assistant motion: overlay move-in from top / move-out to bottom (300ms ease-out), swap with staggered reveal */
.agent.in { animation: agIn .3s cubic-bezier(0,0,.58,1) both; }
.agent.out { animation: agOut .3s cubic-bezier(0,0,.58,1) both; }
@keyframes agIn { from { transform: translateY(852px); } to { transform: none; } }
@keyframes agOut { from { transform: none; } to { transform: translateY(852px); } }
.ag-body.leave { animation: agLeave .22s cubic-bezier(0,0,.58,1) both; }
@keyframes agLeave { to { opacity: 0; transform: translateY(-32px); } }
.agent.rvl .rv { opacity: 0; animation: rv .3s cubic-bezier(0,0,.58,1) forwards; animation-delay: calc(var(--i) * 140ms); }
@keyframes rv { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .agent.in, .agent.out, .ag-body.leave, .agent.rvl .rv { animation-duration: .01s; animation-delay: 0s; } }


/* ===== Pantry / Join-in / Meal Ideas ===== */
.view.v2.on { overflow: hidden; position: relative; background: var(--page); }
.v2 .sc { height: 852px; overflow-y: auto; padding-bottom: 150px; }

C11.4933 7.71679 11.4875 7.70948 11.4805 7.7002C11.4663 7.68153 11.4454 7.65457 11.4199 7.62109C11.3689 7.55396 11.2986 7.46017 11.2197 7.35645C11.0621 7.14914 10.8717 6.89924 10.7422 6.72852C9.94945 5.68355 8.81845 4.97559 7.5 4.97559C7.14091 4.97559 6.79354 5.02441 6.46387 5.11523L5.48438 4.13574C6.10274 3.87173 6.78396 3.72559 7.5 3.72559C9.30154 3.72559 10.771 4.69764 11.7383 5.97266C11.8116 6.06932 11.9045 6.19171 12 6.31738C12.09 6.19902 12.1814 6.07966 12.2627 5.97266C13.1012 4.86939 14.6873 3.72559 16.5 3.72559Z" fill="#343231" stroke="#343231" stroke-width="0.4" stroke-linejoin="miter" style="vector-effect:non-scaling-stroke"/><path d="M18.95 18.0662L18.0662 18.95L4 4.88379L4.88379 4L18.95 18.0662Z" fill="#343231" stroke="#343231" stroke-width="0.4" stroke-linejoin="miter" style="vector-effect:non-scaling-stroke"/></svg>';
  var ARL = '<svg viewBox="0 0 25 25" fill="none"><path d="M5.59961 12.6001H19.5996M12.5996 5.6001L5.59961 12.6001L12.5996 19.6001" stroke="black" stroke-width="1.2"/></svg>';
  var CLX = '<svg viewBox="0 0 24 24" fill="none"><path d="M5.98959 6.48941L18.0104 18.5102M18.0104 6.48941L5.98959 18.5102" stroke="black" stroke-width="1.2"/></svg>';
  var MON = ['Jan','Feb','Mar','Apr'], WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function $(id) { return document.getElementById(id); }
  $('bell').innerHTML = ICON.bell; $('dd').innerHTML = ICON.chevdown; $('basket').innerHTML = ICON.basket; $('disc').innerHTML = ICON.arrow;
  $('tab-home').innerHTML = ICON.tabHome; $('tab-pantry').innerHTML = ICON.tabPantry; $('tab-join').innerHTML = ICON.tabJoin;
  $('view-icon').innerHTML = ICON.view; $('reco-row').className = 'reco'; $('reco-row').innerHTML = '<button class="btn md dark" type="button" aria-label="Recommendations, open">' + ICON.reco + '</button>';

  /* Apr 3 had a breakfast and a dinner; today is Apr 4. */
  var stage, sel, state;
  function reset() { stage = 0; sel = null; state = { breakfast: { v: 1, done: false }, dinner: { v: 1, done: false } }; render(); }
  function mark(m) { return '<span class="mk"><i class="' + (m === 'dinner' ? 'triangle' : 'circle') + '"></i></span>'; }
  function weeks() {
    var el = $('weeks-home'); el.innerHTML = ''; var row = document.createElement('div'); row.className = 'week';
    [[2,29],[2,30],[2,31],[3,1],[3,2],[3,3],[3,4]].forEach(function (p) {
      var d = new Date(2026, p[0], p[1]), k = p[0] + '-' + p[1], b = document.createElement('button'); b.type = 'button';
      b.className = 'day' + (p[0] !== 3 ? ' out' : '') + (sel === k ? ' sel' : ''); b.dataset.key = k;
      b.setAttribute('aria-label', MON[p[0]] + ' ' + p[1] + ', ' + WD[d.getDay()]);
      var n = document.createElement('span'); n.textContent = p[1]; b.appendChild(n);
      if (k === '3-4') { var td = document.createElement('i'); td.className = 'today'; b.appendChild(td); }
      if (k === '3-3') { var pl = document.createElement('span'); pl.className = 'plan'; pl.innerHTML = mark('breakfast') + mark('dinner'); b.appendChild(pl); }
      b.addEventListener('click', function () { if (k === '3-3' && stage === 1) return; });
      row.appendChild(b);
    });
    el.appendChild(row);
  }
  /* slider: knob left edge positions from the Figma states */
  var ZONES = [ { id: 'dislike', x: 35, lab: "Didn\u2019t like it", ic: HEARTB, n: 1 }, { id: 'ok', x: 74, lab: 'Ok', ic: HEART, n: 1 }, { id: 'like', x: 145, lab: 'Enjoyed it', ic: HEARTF, n: 1 }, { id: 'love', x: 195, lab: 'Loved it', ic: HEARTF, n: 2 } ];
  function zoneAt(x) { return x < 54 ? 0 : x < 110 ? 1 : x < 170 ? 2 : 3; }
  function labelHtml(z) { var h = ''; for (var i = 0; i < (z.id === 'ok' ? 0 : z.n); i++) h += z.ic; return h + '<span class="tx">' + z.lab + '</span>'; }
  function placeLabel(lb, z, cx) { lb.innerHTML = labelHtml(z); var w = lb.offsetWidth; lb.style.left = Math.max(0, Math.min(255 - w, cx - w / 2)) + 'px'; }
  function card(kind, name) {
    var st = state[kind];
    var c = document.createElement('div'); c.className = 'rv-item';
    c.innerHTML = '<div class="mtl"><span class="ic"><i class="' + (kind === 'dinner' ? 'triangle' : 'circle') + '"></i></span>' + (kind === 'dinner' ? 'Dinner' : 'Breakfast') + '</div>' +
      '<div class="rv-card" data-k="' + kind + '"><div class="im"><img alt="" src="' + IMGS[kind] + '"></div><div class="ct"><div class="tt"><span class="nm">' + name + '</span><span class="fe"></span><button class="rs" type="button" aria-label="Reset review of ' + name + '"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M1.99963 8.00018C1.99963 11.0809 4.33297 13.6615 7.3983 13.9702C10.4636 14.2789 13.265 12.2155 13.879 9.19618C14.4936 6.17752 12.721 3.18352 9.77897 2.27018C6.8363 1.35618 3.6803 2.81952 2.4763 5.65552M2.4763 2.32285V5.65618H5.80963" stroke="#343231" stroke-width="1.2" style="vector-effect:non-scaling-stroke"/></svg></button></div>' +
      '<div class="sl" role="slider" aria-label="How was ' + name + '?" aria-valuemin="0" aria-valuemax="3" tabindex="0"><div class="trk"></div><div class="lb"></div><div class="kn"></div></div></div><div class="pg"> +1 Join-in progress</div></div>';
    var cd = c.querySelector('.rv-card'), sl = c.querySelector('.sl'), kn = c.querySelector('.kn'), lb = c.querySelector('.lb'), fe = c.querySelector('.fe');
    function sc() { return (sl.offsetWidth || 255) / 255; }
    function setX(x, snap) { kn.style.left = (x * sc()) + 'px'; var z = ZONES[zoneAt(x)]; placeLabel(lb, z, x * sc() + 9); sl.setAttribute('aria-valuenow', zoneAt(x)); return z; }
    var cur = ZONES[st.v];
    sl.setAttribute('aria-valuetext', cur.lab); c._init = function () { setX(cur.x); };
    function finish(zi) {
      var z = ZONES[zi]; st.v = zi; st.rvd = true; var h = ''; for (var i = 0; i < z.n; i++) h += z.ic; fe.innerHTML = h;
      cd.classList.add('rvd');
    }
    var rs = c.querySelector('.rs');
    rs.addEventListener('click', function () { st.v = 1; st.rvd = false; fe.innerHTML = ''; cd.classList.remove('rvd'); sl.setAttribute('aria-valuetext', ZONES[1].lab); setX(ZONES[1].x); });
    var drag = false, moved = false, ox = 0;
    function pos(e) { var r = sl.getBoundingClientRect(); return (e.clientX - r.left) / sc(); }
    kn.addEventListener('pointerdown', function (e) { if (cd.classList.contains('rvd')) return; drag = true; moved = false; sl.classList.add('drag'); kn.setPointerCapture(e.pointerId); ox = pos(e) - parseFloat(kn.style.left) / sc(); e.preventDefault(); });
    kn.addEventListener('pointermove', function (e) { if (!drag) return; moved = true; var x = Math.max(0, Math.min(224, pos(e) - ox)); setX(x); });
    function end() { if (!drag) return; drag = false; sl.classList.remove('drag'); var x = parseFloat(kn.style.left) / sc(), zi = zoneAt(x); setX(x); if (moved) { var t = ZONES[zi]; sl.setAttribute('aria-valuetext', t.lab); setTimeout(function () { finish(zi); }, 450); } }
    kn.addEventListener('pointerup', end); kn.addEventListener('pointercancel', end);
    sl.addEventListener('keydown', function (e) { if (cd.classList.contains('rvd')) return; var zi = zoneAt(parseFloat(kn.style.left) / sc()); if (e.key === 'ArrowRight' && zi < 3) { zi++; } else if (e.key === 'ArrowLeft' && zi > 0) { zi--; } else if (e.key === 'Enter') { finish(zi); return; } else return; setX(ZONES[zi].x); sl.setAttribute('aria-valuetext', ZONES[zi].lab); e.preventDefault(); });
    return c;
  }
