<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Drag a Recipe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Ubuntu:wght@400;500;700&display=swap">
<style>
/* Screens follow the Figma flow: drag-0 (home), drag-0-1 (recipe), drag-1 to drag-6 (edit), drag-7 to drag-9 (home after saving). Values are copied from the Figma file. Single light theme. */
:root {
  --page: #f4f4f4; --desk: #e8e5e4; --bar: #f9f9f9;
  --ink: #000000; --ink-soft: #1b1b1b; --ink-2: #343231; --muted: #93918b; --muted-2: #7a7873; --meal-time: #6b635e; --meal-name: #1f281a;
  --line: #d6d6d6; --line-warm: #d1c0bb; --line-edit: #cbc8c2; --select: #f6d5d9;
  --info-bg: #dddef9; --info-fg: #4f53ce;
  --ok-bg: #cce4df; --ok-fg: #007059;
  --fail-bg: #f6d5d9; --fail-fg: #b5263f;
  --sugg-bg: #f8e7e3; --sugg-fg: #b74f30; --sugg-line: #e7c5bb;
  --m-lunch: #595de3; --m-dinner: #00765e; --m-breakfast: #d05a37;
  --font-display: "DM Serif Display", Georgia, serif;
  --font-body: "Ubuntu", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--desk); color: var(--ink); font-family: var(--font-body); font-size: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
/* text styles */
.t-xs-reg-up { font-weight: 400; font-size: 10px; line-height: 14px; text-transform: uppercase; }
.t-xs-bold-up { font-weight: 700; font-size: 10px; line-height: 14px; text-transform: uppercase; }
.frame { width: 100%; max-width: 393px; margin: 0 auto; background: var(--page); position: relative; overflow: hidden; }
.view { display: none; }
.view.on { display: block; }
.mk { width: 10px; height: 10px; display: grid; place-items: center; flex: none; }
.mk i { display: block; }
.mk .circle { width: 6px; height: 6px; border-radius: 50%; background: var(--m-breakfast); }
.mk .square { width: 6px; height: 6px; background: var(--m-lunch); }
.mk .triangle { width: 7px; height: 6px; background: var(--m-dinner); clip-path: polygon(50% 0, 100% 100%, 0 100%); }

/* components copied from Figma. Shadows: card = 0 16 27 10 at 10%, pressed = 0 4 24 5 at 2%. */
:root { --sh: 0 16px 27.2px 5.5px rgba(0,0,0,.08); --sh-press: 0 16px 27.2px 5.5px rgba(0,0,0,.08); }
.btn { border: 1px solid var(--ink-2); background: var(--page); box-shadow: var(--sh); padding: 0; display: inline-grid; place-items: center; cursor: pointer; flex: none; color: var(--ink-2); }
.btn:hover { background: var(--desk); border-color: var(--meal-time); }
.btn:active { background: var(--desk); box-shadow: var(--sh-press); }
.btn:focus-visible, .mcard:focus-visible { outline: 2px solid var(--meal-time); outline-offset: 4px; }
.btn:disabled { background: var(--line); border-color: transparent; box-shadow: none; cursor: default; }
.btn.sm { height: 32px; min-width: 32px; padding: 0 12px; }
.btn.md { height: 42px; min-width: 42px; padding: 0 12px; }
.btn.dark { background: #000; border-color: transparent; color: #fff; }
.btn.dark:hover { background: var(--meal-time); }
.btn.dark:active { background: #000; box-shadow: var(--sh-press); }
.btn.lg { height: 52px; width: 100%; font-weight: 500; font-size: 16px; line-height: 21px; }
.btn.lg.dark { background: var(--ink-2); }
.btn.lg:disabled { background: var(--line); color: var(--muted); }
.mtl { display: flex; align-items: center; gap: 4px; height: 20px; font-size: 14px; line-height: 16px; color: var(--meal-time); }
.mtl .ic { width: 20px; height: 20px; display: grid; place-items: center; flex: none; }
.mtl .ic i { display: block; }
.mtl .circle { width: 12px; height: 12px; border-radius: 50%; background: var(--m-breakfast); }
.mtl .square { width: 12px; height: 12px; background: var(--m-lunch); }
.mtl .triangle { width: 14px; height: 12px; background: var(--m-dinner); clip-path: polygon(50% 0, 100% 100%, 0 100%); }

/* home */
#home { height: 852px; }
#home .scroll { height: 100%; overflow-y: auto; padding-bottom: 240px; }
.top { height: 112px; padding: 88px 24px 0; display: flex; justify-content: space-between; align-items: flex-start; }
.profile { display: flex; align-items: center; gap: 8px; height: 24px; font-weight: 400; font-size: 14px; line-height: 16px; text-transform: uppercase; color: var(--ink-2); }
.avatar { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--ink-2); }
.bell { width: 27px; height: 25px; margin: -1px -3px 0 0; }
.pad { padding: 0 24px; }
.cal { display: flex; flex-direction: column; gap: 12px; }
.heading { height: 80px; display: flex; align-items: center; justify-content: space-between; }
.month-day { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 400; font-size: 48px; line-height: 56px; color: var(--meal-name); }
.month-day .dd { width: 16px; height: 16px; flex: none; display: block; }
.chev { width: 16px; height: 16px; padding: 0; border: 0; background: none; cursor: pointer; flex: none; display: block; }
.chev svg { width: 16px; height: 16px; display: block; }
.chev.next svg { transform: scaleX(-1); }
.view-toggle { width: 32px; height: 32px; margin-top: 24px; flex: none; }
.dates { padding-top: 16px; display: flex; flex-direction: column; gap: 14px; }
.weekdays { height: 24px; display: flex; justify-content: space-between; align-items: center; }
.weekdays span { width: 36px; text-align: center; font-size: 10px; line-height: 13px; color: var(--ink-soft); }
.weeks { display: flex; flex-direction: column; gap: 8px; }
.week { display: flex; justify-content: space-between; }
.day { width: 36px; height: 36px; padding: 4px 0 0; border: 1.2px dashed var(--line-warm); border-radius: 2px; background: var(--page); display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; font-size: 10px; line-height: 13px; color: var(--ink-2); position: relative; }
.day.out { border-color: var(--line); color: var(--muted); }
.day.sel { background: var(--select); border-color: transparent; }
.day.over { background: var(--select); border: 1.2px solid var(--ink-2); }
.day:hover:not(.sel) { border-color: var(--ink-2); }
.day .today { position: absolute; left: -1.2px; right: -1.2px; bottom: -1.2px; height: 2px; background: #000; }
/* home calendar: mode view, solid surface-page cells, no outline */
#home .day { border: 0; background: var(--page); padding-top: 4px; }
#home .day.out { color: var(--muted); }
#home .day.sel { background: var(--line-warm); color: #000; }
#home .day:hover:not(.sel) { background: var(--desk); }
#home .day .today { left: 0; right: 0; bottom: 0; }
.plan { display: flex; height: 9px; padding: 0 2px; }
.plan .mk { margin-top: -1px; }
.day:focus-visible, .done:focus-visible, .card:focus-visible, .ib:focus-visible, .disc:focus-visible, .chev:focus-visible, .sw:focus-visible, .tab:focus-visible { outline: 2px solid var(--info-fg); outline-offset: 2px; }
.toast-slot { display: flex; justify-content: center; min-height: 26px; }
.toast-slot:empty { display: none; }
.toast-slot.right { justify-content: flex-end; }
.toast { display: inline-flex; align-items: center; gap: 10px; height: 26px; padding: 6px 12px; border-radius: 30px; background: var(--info-bg); color: var(--info-fg); white-space: nowrap; }
.toast.ok { background: var(--ok-bg); color: var(--ok-fg); }
.toast .undo { width: 20px; height: 20px; margin: -3px 0; border: 0; background: none; padding: 0; border-radius: 10px; cursor: pointer; display: grid; place-items: center; flex: none; }
.toast .undo:hover { background: rgba(0,0,0,.08); }
.toast .undo svg { width: 20px; height: 20px; display: block; }
.toast .undo:focus-visible { outline: 2px solid var(--ink-2); outline-offset: 1px; }
.toast.fail { background: var(--fail-bg); color: var(--fail-fg); }
.toast.sugg { gap: 12px; padding: 0 4px 0 10px; border-radius: 14px; background: var(--sugg-bg); color: var(--ink); height: 28px; }
.sugg .content { display: flex; align-items: center; gap: 6px; }
.sugg .sparkle { width: 12px; height: 12px; flex: none; }
.sugg .actions { display: flex; align-items: center; gap: 4px; }
.sugg .divider { width: 1px; height: 20px; background: var(--sugg-line); }
.ib { width: 20px; height: 20px; border: 0; background: none; padding: 0; border-radius: 10px; cursor: pointer; display: grid; place-items: center; }
.ib:hover { background: rgba(183,79,48,.12); }
.ib svg { width: 20px; height: 20px; display: block; }
.disc { display: flex; justify-content: center; width: 100%; height: 12px; padding: 0; border: 0; background: none; cursor: pointer; margin: 12px 0 8px; }
.disc svg { width: 12px; height: 12px; transition: transform .2s; }
.disc.open svg { transform: rotate(180deg); }
.plan-list { padding: 0 24px; }
.edit-btn { display: flex; justify-content: flex-end; }
.edit-btn .btn svg { width: 16px; height: 16px; display: block; }
.daily { padding-top: 16px; display: flex; flex-direction: column; gap: 16px; }
.mcc { display: flex; flex-direction: column; gap: 16px; }
.mcard { display: block; width: 100%; height: 74px; border: 0; padding: 0; background: none; text-align: left; cursor: pointer; font: inherit; }
.mcard .cc { display: flex; gap: 16px; height: 74px; background: var(--page); box-shadow: var(--sh); }
.mcard img { width: 74px; height: 74px; object-fit: cover; display: block; flex: none; background: #fff; }
.mcard .nm { flex: 1; display: flex; align-items: center; font-weight: 500; font-size: 16px; line-height: 21px; color: var(--meal-name); }
.mcard:hover .cc { background: var(--desk); }
.mcard:hover .nm { color: var(--meal-time); }
.mcard:active .cc { background: var(--desk); box-shadow: var(--sh-press); }
.mcard:active .nm { color: #000; }
.mcard:disabled .cc { background: var(--line); box-shadow: none; }
.mcard:disabled .nm { color: var(--muted); }
.empty { padding: 24px 0; font-size: 14px; color: var(--muted-2); }
.dock { position: absolute; left: 0; right: 0; bottom: 0; height: 222px; pointer-events: none; }
.dock > * { pointer-events: auto; }
.reco { height: 42px; padding: 0 24px; display: flex; justify-content: flex-end; }
.reco .btn { width: 44px; }
.reco .btn svg { width: 20px; height: 20px; }
.groc { height: 42px; margin-top: 14px; padding: 0 24px; display: flex; justify-content: flex-end; }
.basket { position: relative; width: 42px; height: 42px; background: #fff; box-shadow: var(--sh); flex: none; }
.basket .btn { width: 42px; height: 42px; padding: 0; border-width: 1.2px; box-shadow: none; }
.basket .btn svg { width: 20px; height: 20px; }
.basket .count { position: absolute; left: 31px; top: -4px; width: 16px; height: 16px; border-radius: 50%; background: #ff5858; color: #fff; font-size: 12px; line-height: 14px; text-align: center; pointer-events: none; }
.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 108px; background: var(--bar); display: flex; justify-content: space-between; padding: 12px 48px 0; }
.tab { width: 48px; height: 50px; border: 0; background: none; padding: 0; cursor: pointer; }
.tab svg { width: 48px; height: 50px; display: block; }

/* edit (drag-1 to drag-6) and recipe (drag-0-1) */
.overlay { height: 96px; padding: 56px 24px 0; display: flex; justify-content: flex-end; }
.close { width: 24px; height: 24px; border: 0; background: none; padding: 0; cursor: pointer; }
.close svg { width: 24px; height: 24px; display: block; }
.edit-part { padding-top: 24px; display: flex; flex-direction: column; gap: 24px; border-top: 1px solid var(--line-edit); margin-top: 14px; }
.cards { display: flex; gap: 24px; min-height: 126px; }
.slot { width: 98px; display: flex; flex-direction: column; gap: 8px; flex: none; }
.opt { height: 20px; padding: 0 0 4px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--ink-2); color: var(--ink); width: fit-content; }
.opt .mk { width: 13px; height: 13px; }
.opt svg { width: 16px; height: 16px; margin-left: -2px; }
.card { width: 98px; height: 98px; border: 0; padding: 0; background: var(--line-warm); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; position: relative; overflow: hidden; display: block; }
.card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.card:active { cursor: grabbing; }
/* meal-card square states: default, hover (multiply 25%), action (multiply 10%) with optional label at the bottom */
.card::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; }
.card:hover::after { opacity: 1; }
.card.act::after, .card.act:hover::after { background: rgba(0,0,0,.1); opacity: 1; }
/* chip (type info) above the dragged card while it is near the delete button */
.ghost .tip { position: absolute; left: 0; bottom: 100%; margin-bottom: 6px; height: 24px; padding: 0 12px; border-radius: 22px; background: var(--info-bg); color: var(--info-fg); align-items: center; white-space: nowrap; display: none; }
.ghost.near .tip { display: inline-flex; }
.card:focus-visible { outline: 2px solid var(--meal-time); outline-offset: 3px; }
.card.dim { opacity: .35; }
.card.dim::after { opacity: 0; }
.card.picked { box-shadow: 0 0 0 2px var(--page), 0 0 0 4px var(--ink-2); }
.ghost { position: fixed; z-index: 50; width: 98px; height: 98px; pointer-events: none; transform: translate(-50%, -60%) rotate(-3deg); box-shadow: 0 14px 28px rgba(0,0,0,.28); }
.edit-footer { display: flex; flex-direction: column; gap: 24px; }
.keep { display: flex; justify-content: space-between; align-items: center; }
.keep .title { font-weight: 500; font-size: 14px; line-height: 16px; color: #343131; }
.keep .hint { font-size: 12px; line-height: 15px; color: var(--muted-2); margin-top: 2px; }
.sw { width: 44px; height: 26px; border-radius: 13px; border: 0; background: var(--line-edit); position: relative; padding: 0; cursor: pointer; transition: background .15s; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--page); transition: transform .15s; }
.sw[aria-checked="true"] { background: var(--ink-2); }
.sw[aria-checked="true"]::after { transform: translateX(18px); }
.foot { display: flex; justify-content: flex-end; gap: 10px; }
.btn.del { width: 42px; height: 42px; min-width: 42px; padding: 0; }
.btn.del svg { width: 20px; height: 20px; display: block; }
.btn.del.over { background: var(--desk); border-color: var(--meal-time); }
.btn.del.over.bin { transform: scale(1.06); }
.done { width: 58px; height: 42px; padding: 12px; border: 0; background: var(--ink-2); color: #fff; font-size: 14px; line-height: 16px; cursor: pointer; }
.done:hover { background: #000; }

#recipe { padding-bottom: 0; }
.r-main { display: flex; flex-direction: column; gap: 48px; }
.sel-dates { display: flex; gap: 8px; align-items: center; height: 42px; }
.sel-dates .btn { width: 44px; height: 42px; background: var(--ink-2); border-color: transparent; padding: 0; }
.sel-dates .btn:hover { background: var(--meal-time); }
.sel-dates .btn svg { width: 20px; height: 20px; }
.date-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.dchip { height: 40px; display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--ink-2); background: var(--page); font-size: 14px; line-height: 16px; white-space: nowrap; flex: none; color: #000; }
.dchip .mtl { color: #000; }
.dchip button { width: 20px; height: 20px; border: 0; background: none; padding: 0; cursor: pointer; }
.dchip svg { width: 20px; height: 20px; display: block; }
.r-head { display: flex; flex-direction: column; gap: 24px; }
.r-header { display: flex; flex-direction: column; gap: 10px; }
.r-title { display: flex; align-items: center; gap: 6px; height: 40px; justify-content: space-between; }
.r-name { font-family: var(--font-display); font-size: 36px; line-height: 40px; color: var(--ink-soft); margin: 0; font-weight: 400; }
.r-title .btn { width: 40px; }
.r-title .btn svg { width: 16px; height: 16px; }
.r-info { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid #000; border-bottom: 1px solid #000; }
.chip { height: 24px; padding: 0 12px; border-radius: 22px; display: inline-flex; align-items: center; color: #000; }
.chip.line { border: 1px solid #000; padding: 0 11px; }
.r-img { position: relative; height: 163px; background: #fff; }
.r-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.r-img .btn { position: absolute; right: 6px; bottom: 8px; width: 24px; height: 24px; min-width: 0; padding: 0; border-color: transparent; box-shadow: none; }
.r-img .btn svg { width: 14px; height: 14px; }
.r-instr { display: flex; flex-direction: column; gap: 24px; }
.r-sec { display: flex; flex-direction: column; gap: 16px; }
.r-sec.steps { padding: 10px 0; }
.sh { display: flex; align-items: center; justify-content: space-between; height: 25px; }
.sh h2 { font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 25px; margin: 0; color: var(--ink-2); }
.sh svg { width: 16px; height: 16px; display: block; }
.step-wrap { display: flex; flex-direction: column; gap: 12px; }
.step-list { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; margin: 0 -24px; padding: 0 24px; }
.step-list::-webkit-scrollbar, .pantry::-webkit-scrollbar { display: none; }
.step { width: 104px; flex: none; display: flex; flex-direction: column; gap: 8px; }
.step .im { width: 104px; height: 104px; background: #e9e6df; }
.step .im img { width: 100%; height: 100%; object-fit: cover; display: block; }
.step p { margin: 0; font-size: 12px; line-height: 15px; color: #696969; }
.sbar { width: 26px; height: 6px; position: relative; margin: 0 auto; }
.sbar b { position: absolute; left: 2px; top: 0; width: 22px; height: 6px; background: #c8c8c8; border-radius: 8px; }
.sbar i { position: absolute; top: 0; left: 2px; width: 6px; height: 6px; border-radius: 50%; background: #929292; }
.sp { display: flex; flex-direction: column; gap: 12px; }
.serving { display: flex; gap: 5px; align-items: center; height: 32px; }
.serving .btn { width: 32px; padding: 0; }
.serving .btn svg { width: 16px; height: 16px; }
.serv-sel { position: relative; width: 90px; height: 32px; }
.sel-list { position: absolute; left: 0; top: 32px; width: 90px; z-index: 5; box-shadow: var(--sh); }
.sel-opt:hover { background: var(--desk); }
.sel-opt { height: 32px; width: 90px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 12px; border: 1px solid var(--ink-2); background: var(--page); color: var(--ink-2); font-size: 10px; line-height: 14px; cursor: default; }
.sel-opt b { font-weight: 500; font-size: 12px; line-height: 15px; }
.sel-opt svg { width: 16px; height: 16px; margin-left: auto; }
.pantry { overflow-x: auto; scrollbar-width: none; margin: -8px -24px -40px; padding: 8px 24px 40px; }
.pantry-in { width: 594px; display: flex; flex-direction: column; gap: 12px; }
.prow { display: flex; gap: 12px; }
.stock { width: 190px; height: 90px; background: var(--page); box-shadow: var(--sh); display: flex; align-items: center; gap: 20px; padding: 12px 12px 12px 8px; flex: none; }
.stock .ing { width: 48px; height: 48px; flex: none; }
.stock .ing svg { width: 48px; height: 48px; display: block; }
.stock .cn { width: 102px; display: flex; flex-direction: column; gap: 9px; }
.stock .lc { border-bottom: 1px solid var(--ink-2); padding-bottom: 5px; font-size: 14px; line-height: 16px; color: #000; }
.stock .pc { display: flex; flex-direction: column; gap: 4px; }
.stock .need { display: flex; align-items: center; gap: 2px; height: 16px; font-size: 10px; line-height: 13px; color: var(--ink-soft); }
.stock .qu { display: flex; align-items: baseline; gap: 4px; }
.stock .qu b { font-weight: 400; font-size: 14px; line-height: 16px; color: #000; }
.stock .qu span { font-size: 10px; color: var(--muted); }
.stock .st { display: flex; height: 16px; font-size: 14px; line-height: 16px; color: #000; }
.prow .add { width: 44px; height: 42px; }
.prow .add svg { width: 20px; height: 20px; }
.blank { background: var(--desk); width: 100%; }
.note { width: 100%; height: 146px; padding: 24px; border: 1px solid var(--muted); background: var(--page); font: inherit; font-size: 12px; line-height: 16px; resize: none; color: var(--ink-2); }
.note::placeholder { color: var(--muted); }
.r-btn { padding: 24px 24px 32px; margin: 48px -24px 0; background: var(--page); }

.help { max-width: 393px; margin: 16px auto 0; font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 12px; }
.help button { background: none; border: 0; padding: 0; font-size: 12px; color: var(--ink-2); text-decoration: underline; cursor: pointer; flex: none; }
@media (prefers-reduced-motion: no-preference) { .day.landed { animation: land .5s ease-out; } }
@keyframes land { 0% { background: var(--ok-bg); } 100% { background: var(--page); } }
</style>

<main>
  <div class="frame">
    <!-- drag-0, drag-7, drag-8, drag-9 -->

  var plans, sel, picked, sugg, toast, timer, undo, hist, keep, view, from, expanded;
  var homeSlot = $('slot-home'), editSlot = $('slot-edit');

  function key(d) { return d.getMonth() + '-' + d.getDate(); }
  function allDays() { var a = []; for (var i = 0; i < 35; i++) a.push(new Date(YEAR, 2, 29 + i)); return a; }
  function dn(d) { return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
  function fromDn(n) { var d = new Date(n * 864e5); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
  function keyDate(k) { var p = k.split('-'); return new Date(YEAR, +p[0], +p[1]); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function mark(meal) { var s = document.createElement('span'); s.className = 'mk'; s.innerHTML = '<i class="' + (meal === 'lunch' ? 'square' : meal === 'dinner' ? 'triangle' : 'circle') + '"></i>'; return s; }
  function mealsOn(k) { return ORDER.filter(function (m) { return (plans[k] || []).indexOf(m) > -1; }); }
  function addMeal(k, m) { plans[k] = plans[k] || []; if (plans[k].indexOf(m) < 0) plans[k].push(m); }
  function dropMeal(k, m) { var l = plans[k]; if (!l) return; var i = l.indexOf(m); if (i > -1) l.splice(i, 1); if (!l.length) delete plans[k]; }
  function seed() { plans = { '3-8': ['breakfast', 'lunch', 'dinner'], '3-10': ['lunch'] }; sel = '3-8'; picked = null; sugg = null; undo = null; hist = {}; keep = true; expanded = false; from = 'home'; setToast(hint()); show('home'); }
  function hint() { return { kind: 'hint', text: 'Drag a recipe onto a day' }; }
  function label(k) { var d = keyDate(k); return MON[d.getMonth()] + ' ' + d.getDate(); }

  function show(v) { view = v; ['home', 'edit', 'recipe'].forEach(function (id) { $(id).classList.toggle('on', id === v); }); renderAll(); window.scrollTo(0, 0); }
  function renderAll() {
    if (delUndo) { delUndo = null; if (toast && toast.undo) toast = null; }
    document.querySelectorAll('.sel-day').forEach(function (e) { e.textContent = keyDate(sel).getDate(); });
    renderWeeks(); renderToast();
    if (view === 'home') renderMeals(); if (view === 'edit') { renderCards(); renderKeep(); } if (view === 'recipe') renderRecipe();
    $('weeks-home').parentNode.parentNode.nextElementSibling.classList.toggle('open', expanded);

  }

  function renderWeeks() {

    days.forEach(function (d, i) { if (key(d) === sel) selIdx = i; });
    [['weeks-home', true], ['weeks-edit', false]].forEach(function (cfg) {
      var el = $(cfg[0]); if (view === 'recipe' || (cfg[1] && view !== 'home') || (!cfg[1] && view !== 'edit')) { el.innerHTML = ''; return; }
      el.innerHTML = '';
      var first = 0, count = 5; if (cfg[1] && !expanded) { first = Math.floor(selIdx / 7); count = 1; }
      for (var w = first; w < first + count; w++) {
        var row = document.createElement('div'); row.className = 'week';

          var n = document.createElement('span'); n.textContent = d.getDate(); b.appendChild(n);

          row.appendChild(b);
        });
        el.appendChild(row);
      }
    });
  }

  /* home meal list: the meals planned on the selected day */

    if (!list.length) { var e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No meals planned for ' + label(sel); el.appendChild(e); return; }
    list.forEach(function (m) {
      var box = document.createElement('div'); box.className = 'mcc'; box.appendChild(mtl(m));
      var b = document.createElement('button'); b.type = 'button'; b.className = 'mcard'; b.setAttribute('aria-label', RECIPES[m].name + (m === 'lunch' ? ', open recipe' : ''));
      b.innerHTML = '<span class="cc"><img alt="" src="' + IMG[m] + '"><span class="nm"></span></span>'; b.querySelector('.nm').textContent = RECIPES[m].name;
      if (m === 'lunch') b.addEventListener('click', function () { openRecipe(m, 'home'); }); else b.setAttribute('aria-label', RECIPES[m].name); box.appendChild(b); el.appendChild(box);
    });
  }

  /* edit cards: only the meals planned on the selected day */
  function renderCards() {
    var el = $('cards'); el.innerHTML = ''; var list = mealsOn(sel);
    if (!list.length) { var e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No recipes on ' + label(sel) + '. Tap another day.'; el.appendChild(e); return; }
    list.forEach(function (m) {
      var s = document.createElement('div'); s.className = 'slot';
      var o = document.createElement('div'); o.className = 'opt t-xs-reg-up'; o.appendChild(mark(m)); o.appendChild(document.createTextNode(LABEL[m])); o.insertAdjacentHTML('beforeend', ICON.optchev);
      s.appendChild(o); s.appendChild(makeCard(m)); el.appendChild(s);
    });
  }
  function makeCard(m, ghost) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'card' + (!ghost && picked === m ? ' picked' : ''); b.dataset.meal = m;
    b.setAttribute('aria-label', LABEL[m] + ' recipe. Drag onto a day, or press to pick it and then choose a day.');
    var im = document.createElement('img'); im.src = IMG[m]; im.alt = ''; b.appendChild(im);
    if (ghost) b.classList.add('act');
    if (!ghost) attach(b, m); return b;
  }
  function renderKeep() { $('keep').setAttribute('aria-checked', keep); $('keep-hint').textContent = keep ? 'Plan stays and is copied to the new days' : 'Plan moves to the new days'; }

  /* toast: hint, ok and fail are centered; the suggestion is right-aligned */
  function setToast(t, ms) { toast = t; clearTimeout(timer); renderToast(); if (ms) timer = setTimeout(function () { setToast(sugg ? suggToast() : (picked ? pickToast() : hint())); }, ms); }
  function pickToast() { return { kind: 'hint', text: 'Tap a day to place the ' + LABEL[picked].toLowerCase() + ' recipe' }; }
  function suggToast() { return { kind: 'sugg', lead: sugg.lead, tail: '· 4 weeks' }; }
  function renderToast() {
    homeSlot.innerHTML = ''; editSlot.innerHTML = '';
    var slot = view === 'edit' ? editSlot : homeSlot; if (view === 'recipe' || !toast) return;
    if (view === 'home' && toast.kind === 'hint') return;
    slot.className = 'toast-slot' + (toast.kind === 'sugg' ? ' right' : '');
    var t = document.createElement('div');
    if (toast.kind === 'sugg') {
      t.className = 'toast sugg t-xs-bold-up'; t.setAttribute('role', 'status');
      t.innerHTML = '<span class="content">' + ICON.spark + '<span class="txt"></span></span><span class="actions"><button class="ib" id="yes" type="button" aria-label="Accept">' + ICON.ok + '</button><span class="divider"></span><button class="ib" id="no" type="button" aria-label="Dismiss">' + ICON.no + '</button></span>';
      t.querySelector('.txt').textContent = toast.lead + ' ' + toast.tail;
    } else if (toast.undo) { t.className = 'toast t-xs-bold-up ' + toast.kind; t.setAttribute('role', 'status'); t.innerHTML = '<span class="txt"></span><button class="undo" id="undo-del" type="button" aria-label="Undo delete">' + ICON.undo + '</button>'; t.querySelector('.txt').textContent = toast.text; }
    else { t.className = 'toast t-xs-bold-up ' + toast.kind; t.setAttribute('role', 'status'); t.textContent = toast.text; }
    slot.appendChild(t);
    var ud = $('undo-del'); if (ud) ud.addEventListener('click', undoDelete);
    var y = $('yes'), n = $('no');
    if (y) y.addEventListener('click', function () { if (undo) { undo = null; sugg = null; setToast({ kind: 'ok', text: 'Changes saved!' }, 2200); } else acceptSugg(); });
    if (n) n.addEventListener('click', function () { if (undo) { undo.forEach(function (u) { dropMeal(u.k, u.m); }); undo = null; renderAll(); } sugg = null; setToast(picked ? pickToast() : hint()); });
  }

  /* dropping a card on a day. The source is the day the card was on (the selected day). */
  var delUndo = null;
  function removePlan(m) {
    picked = null; undo = null; dropMeal(sel, m); delete hist[m]; sugg = null; renderAll();
    delUndo = { k: sel, m: m }; setToast({ kind: 'ok', text: 'Plan deleted', undo: true });
  }
  function undoDelete() {
    var u = delUndo; if (!u) return; delUndo = null; addMeal(u.k, u.m); toast = null; renderAll(); setToast(sugg ? suggToast() : hint());
  }
  function place(m, d) {
    var k = key(d), src = sel; picked = null; undo = null;
    if (mealsOn(k).indexOf(m) > -1) { sel = k; renderAll(); setToast({ kind: 'fail', text: LABEL[m] + ' is already on ' + label(k) }, 2200); return; }
    addMeal(k, m); if (!keep && src !== k) dropMeal(src, m);
    sel = k; learn(m, src, d);
    renderAll();
    var el = document.querySelector('#weeks-edit [data-key="' + k + '"]'); if (el) el.classList.add('landed');
    setToast({ kind: 'ok', text: 'Plans added!' }, 1400);
  }
  /* Read the pattern: remember the days this meal was dropped on, then use the gap between the last two days. */
  function learn(m, srcKey, d) {
    var h = hist[m] || (hist[m] = [dn(keyDate(srcKey))]), n = dn(d);
    h.push(n); if (h.length > 3) h.shift();
    var step = n - h[h.length - 2];
    if (step < 1) { hist[m] = [n]; sugg = null; return; }
    sugg = { meal: m, step: step, last: n, lead: stepText(step, d) };
  }
  function stepText(step, d) {
    if (step === 1) return 'Every day';
    if (step === 2) return 'Every other day';
    if (step === 7) return 'Every ' + WD[d.getDay()].slice(0, 3);
    if (step % 7 === 0) return 'Every ' + (step / 7) + ' weeks';
    return 'Every ' + step + ' days';
  }
  function acceptSugg() {
    var s = sugg, added = []; if (!s) return;
    var first = dn(allDays()[0]), last = dn(allDays()[34]);
    for (var n = s.last + s.step; n <= s.last + Math.max(28, s.step) && n <= last; n += s.step) {
      if (n < first) continue; var k = key(fromDn(n));
      if (mealsOn(k).indexOf(s.meal) < 0) { addMeal(k, s.meal); added.push({ k: k, m: s.meal }); }
    }
    renderAll();
    if (!added.length) { sugg = null; setToast({ kind: 'hint', text: 'Nothing more to add in view' }, 2200); return; }
    undo = added; setToast({ kind: 'sugg', lead: added.length + ' more ' + (added.length === 1 ? 'day' : 'days'), tail: '· 4 weeks' });
  }

  function attach(el, m) {
    var sx, sy, drag = null, down = false;
    el.addEventListener('pointerdown', function (e) { if (e.button !== 0) return; el.classList.add('act'); down = true; sx = e.clientX; sy = e.clientY; drag = null; try { el.setPointerCapture(e.pointerId); } catch (x) {} });
    el.addEventListener('pointermove', function (e) {
      if (!down) return;
      if (!drag && Math.hypot(e.clientX - sx, e.clientY - sy) > 6) {
        picked = null; var g = document.createElement('div'); g.className = 'ghost'; g.appendChild(makeCard(m, true)); var tp = document.createElement('span'); tp.className = 'tip t-xs-reg-up'; tp.textContent = 'Remove'; g.appendChild(tp); document.body.appendChild(g);
        drag = { ghost: g, over: null }; el.classList.add('dim'); setToast({ kind: 'hint', text: 'Drop it on a day' });
      }
      if (drag) {
        drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px';
        var dr = $('del').getBoundingClientRect(), near = e.clientX > dr.left - 28 && e.clientX < dr.right + 28 && e.clientY > dr.top - 28 && e.clientY < dr.bottom + 28;
        drag.ghost.classList.toggle('near', near);
        var hit = document.elementFromPoint(e.clientX, e.clientY), day = near ? $('del') : (hit && hit.closest ? hit.closest('.day') : null);
        if (drag.over !== day) { if (drag.over) drag.over.classList.remove('over', 'bin'); if (day) day.classList.add('over'); if (day && day.id === 'del') day.classList.add('bin'); drag.over = day; }
      }
    });
    function finish(e, cancelled) {
      if (!down) return; down = false; el.classList.remove('act'); try { el.releasePointerCapture(e.pointerId); } catch (x) {}
      if (drag) { var day = drag.over; drag.ghost.remove(); el.classList.remove('dim'); drag = null; if (day && !cancelled && day.id === 'del') { day.classList.remove('over', 'bin'); removePlan(m); } else if (day && !cancelled) place(m, new Date(+day.dataset.ts)); else { renderAll(); setToast(sugg ? suggToast() : hint()); } }
      else if (!cancelled) { picked = picked === m ? null : m; renderCards(); setToast(picked ? pickToast() : (sugg ? suggToast() : hint())); }
    }
    el.addEventListener('pointerup', function (e) { finish(e, false); });
    el.addEventListener('pointercancel', function (e) { finish(e, true); });
    el.addEventListener('click', function (e) { if (e.detail === 0) { picked = picked === m ? null : m; renderCards(); setToast(picked ? pickToast() : hint()); var a = document.querySelector('#cards [data-meal="' + m + '"]'); if (a) a.focus(); } });
  }

  /* recipe page (drag-0-1) */
  var recipeMeal = 'lunch', dirty = false, serv = 1, servOpen = false;
  var ING_ICON = { Avocado: ICON.ingAvocado, Bread: ICON.ingBread, 'Olive Oil': ICON.ingOil, Salt: ICON.ingSalt, Egg: ICON.ingEgg };
  function openRecipe(m, back) { recipeMeal = m; from = back; dirty = false; serv = 1; servOpen = false; show('recipe'); }
  function qty(n) { return String(Math.round(n * serv * 100) / 100); }
  function stock(i) { return '<div class="stock"><span class="ing">' + (ING_ICON[i[0]] || '') + '</span><div class="cn"><div class="lc">' + i[0] + '</div><div class="pc"><div class="need"><span>Need</span><span class="qu"><b>' + qty(+i[1]) + '</b><span>' + i[2] + '</span></span></div><div class="st">0</div></div></div></div>'; }
  function renderRecipe() {
    var m = recipeMeal, r = RECIPES[m], el = $('recipe-body'), full = m === 'lunch';
    var dates = Object.keys(plans).filter(function (k) { return plans[k].indexOf(m) > -1; }).sort(function (a, b) { return keyDate(a) - keyDate(b); });
    var chips = dates.map(function (k) { var d = keyDate(k); return '<div class="dchip"><span class="mtl"><span class="ic"><i class="' + (m === 'lunch' ? 'square' : m === 'dinner' ? 'triangle' : 'circle') + '"></i></span>' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + WD[d.getDay()].slice(0, 3) + '</span><button type="button" data-rm="' + k + '" aria-label="Remove ' + label(k) + '">' + ICON.xs + '</button></div>'; }).join('');
    var steps = full ? '<div class="step-wrap"><div class="step-list" id="step-list">' + r.steps.map(function (t, i) { return '<div class="step"><div class="im"><img alt="" src="' + STEPIMG[i] + '"></div><p>' + t + '</p></div>'; }).join('') + '</div><div class="sbar"><b></b><i id="sthumb"></i></div></div>' : '<div class="blank" style="height:174px" aria-hidden="true"></div>';
    var ing = full ? '<div class="sp"><div class="serving"><button class="btn sm" type="button" id="s-reset" aria-label="Reset serving">' + ICON.reset + '</button><div class="serv-sel"><button class="sel-opt" type="button" id="s-btn" aria-haspopup="listbox" aria-expanded="' + servOpen + '"><b>' + serv + '</b><span>Serving</span>' + (servOpen ? ICON.selup : ICON.selchev) + '</button>' + (servOpen ? '<div class="sel-list" role="listbox">' + [1, 2, 3].map(function (n) { return '<button class="sel-opt" type="button" role="option" data-s="' + n + '" aria-selected="' + (n === serv) + '"><b>' + n + '</b><span>Serving</span></button>'; }).join('') + '</div>' : '') + '</div></div><div class="pantry"><div class="pantry-in"><div class="prow">' + r.ing.slice(0, 3).map(stock).join('') + '</div><div class="prow">' + r.ing.slice(3).map(stock).join('') + '<button class="btn md dark add" type="button" aria-label="Add ingredient">' + ICON.addw + '</button></div></div></div></div>' : '<div class="blank" style="height:260px" aria-hidden="true"></div>';
    el.innerHTML = '<div class="sel-dates"><button class="btn md" type="button" id="r-dates" aria-label="Edit dates">' + ICON.cal + '</button><div class="date-chips">' + chips + '</div></div>' +
      '<div class="r-head"><div class="r-header"><div class="r-title"><h1 class="r-name">' + r.name + '</h1><button class="btn sm" type="button" aria-label="Search">' + ICON.search + '</button></div><div class="r-info t-xs-reg-up">' + r.info.map(function (t, i) { return '<span class="chip' + (i === 0 ? ' line' : '') + '">' + t + '</span>'; }).join('') + '</div></div>' +
      '<div class="r-img"><img alt="' + r.name + '" src="' + (full ? IMG.recipe : IMG[m]) + '"><button class="btn" type="button" aria-label="Change photo">' + ICON.plus + '</button></div></div>' +
      '<div class="r-instr"><div class="r-sec steps"><div class="sh"><h2>Steps</h2>' + ICON.edit + '</div>' + steps + '</div>' +
      '<div class="r-sec"><div class="sh"><h2>Ingredients</h2></div>' + ing + '</div>' +
      '<div class="r-sec"><div class="sh"><h2>Note</h2></div><textarea class="note" id="note" placeholder="Placeholder" aria-label="Note"></textarea></div></div>';
    $('r-done').disabled = !dirty;
    $('r-dates').addEventListener('click', function () { show('edit'); });
    $('note').addEventListener('input', function () { dirty = true; $('r-done').disabled = false; });
    el.querySelectorAll('[data-rm]').forEach(function (b) { b.addEventListener('click', function () { dropMeal(b.dataset.rm, m); dirty = true; renderAll(); }); });
    var sb = $('s-btn'); if (sb) { sb.addEventListener('click', function (e) { e.stopPropagation(); servOpen = !servOpen; renderRecipe(); }); $('s-reset').addEventListener('click', function () { if (serv !== 1) { serv = 1; servOpen = false; renderRecipe(); } }); el.querySelectorAll('[data-s]').forEach(function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); serv = +b.dataset.s; servOpen = false; renderRecipe(); var nb = $('s-btn'); if (nb) nb.focus(); }); }); }
    var sl = $('step-list'); if (sl) sl.addEventListener('scroll', function () { var mx = sl.scrollWidth - sl.clientWidth; $('sthumb').style.left = (2 + (mx > 0 ? sl.scrollLeft / mx : 0) * 16) + 'px'; });
  }
  document.addEventListener('click', function () { if (servOpen) { servOpen = false; renderRecipe(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && servOpen) { servOpen = false; renderRecipe(); } });
  $('r-done').addEventListener('click', function () { show(from); });

  document.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', function () { picked = null; if (view === 'recipe') show(from); else show('home'); }); });
  document.querySelectorAll('.chev').forEach(function (b) { b.addEventListener('click', function () { var days = allDays(), i = 0; days.forEach(function (d, x) { if (key(d) === sel) i = x; }); i = Math.max(0, Math.min(34, i + +b.dataset.step)); sel = key(days[i]); picked = null; renderAll(); }); });
  $('edit-btn').addEventListener('click', function () { picked = null; setToast(hint()); show('edit'); });
  $('disc').addEventListener('click', function () { expanded = !expanded; renderAll(); });
  $('del').addEventListener('click', function () { if (picked) removePlan(picked); else setToast({ kind: 'hint', text: 'Drag a recipe onto the bin' }, 2000); });
  $('keep').addEventListener('click', function () { keep = !keep; renderKeep(); if (delUndo) { delUndo = null; setToast(sugg ? suggToast() : (picked ? pickToast() : hint())); } });
  $('done').addEventListener('click', function () { picked = null; sugg = null; undo = null; hist = {}; show('home'); setToast({ kind: 'ok', text: 'Changes saved!' }, 2200); });
  $('reset').addEventListener('click', function () { seed(); });
  seed();
})();
</script>

</body></html>
